<!DOCTYPE html>
<!--
  CFTRadar - صفحة التريلر (Telegram Mini App)
  بترفعها مرة واحدة على GitHub Pages، والبوت بيفتحها لكل الأفلام:
      trailer.html?v=<كود فيديو يوتيوب>&t=<اسم الفيلم>
  مفيهاش أي توكن ولا بيانات خاصة - آمنة إنها تبقى Public.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CFTRadar - التريلر</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  /* «أفيش زمان»: نفس ألوان وخامات صفحة الأفلام (ألوان تيليجرام لو موجودة لسه بتغطي الخلفية والنص زي الأول) */
  :root {
    --bg: #140D08; --text: #F6E7C6; --hint: #BFA987;
    --button: #E9B949; --button-text: #140D08; --card: #22160D;
    --gold: #E9B949; --red: #C9412C; --cream: #F6E7C6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "Tajawal", Tahoma, Arial, sans-serif;
  }
  body { background-image: repeating-conic-gradient(from 0deg at 50% 100%, rgba(233,185,73,.12) 0deg 6deg, transparent 6deg 12deg); }
  .wrap {
    display: flex; flex-direction: column; gap: 14px;
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
  }
  .head { text-align: center; }
  h1 { font-family: "Rakkas", serif; font-weight: 400; font-size: 26px; margin: 2px 0 0; line-height: 1.6;
    color: var(--gold); text-shadow: 2px 2px 0 var(--red); }
  .player {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    background: #000; overflow: hidden; border: 3px solid var(--cream); box-shadow: 5px 5px 0 var(--red);
  }
  @supports not (aspect-ratio: 16 / 9) { .player { height: 0; padding-top: 56.25%; } }
  .player iframe, #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .msg { display: none; padding: 14px; background: var(--card); line-height: 1.7; border: 2px solid var(--red); font-weight: 700; }
  .actions { display: flex; gap: 12px; margin-top: 4px; }
  button {
    flex: 1; min-height: 52px; padding: 10px 8px; border: 0;
    font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; white-space: nowrap;
  }
  .done { background: var(--gold); color: #140D08; box-shadow: 5px 5px 0 var(--red);
    font-family: "Rakkas", serif; font-weight: 400; font-size: 22px; }
  .youtube { background: transparent; color: var(--text); border: 2px solid var(--cream); display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1 id="title">التريلر</h1>
  </div>
  <div class="player" id="player"><div id="yt"></div></div>
  <div class="msg" id="msg"></div>
  <div class="actions">
    <button class="youtube" id="youtube">افتح على يوتيوب ↗</button>
    <button class="done" id="close">تمام شفت التريلر</button>
  </div>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  var params = new URLSearchParams(window.location.search);
  var videoId = params.get("v") || "";
  var movieTitle = params.get("t") || "";
  var validId = /^[A-Za-z0-9_-]{11}$/.test(videoId);   // كود يوتيوب سليم بس
  var watchUrl = "https://www.youtube.com/watch?v=" + videoId;
  var playerStarted = false;

  // ---- ثيم Telegram (فاتح / غامق) ----
  if (tg) {
    try {
      tg.ready();
      tg.expand();
      var t = tg.themeParams || {};
      var root = document.documentElement.style;
      if (t.bg_color) root.setProperty("--bg", t.bg_color);
      if (t.text_color) root.setProperty("--text", t.text_color);
      if (t.hint_color) root.setProperty("--hint", t.hint_color);
      if (t.button_color) root.setProperty("--button", t.button_color);
      if (t.button_text_color) root.setProperty("--button-text", t.button_text_color);
      if (t.secondary_bg_color) root.setProperty("--card", t.secondary_bg_color);
      if (tg.setHeaderColor) tg.setHeaderColor("bg_color");
    } catch (e) { /* نسخة Telegram قديمة: الألوان الافتراضية */ }
  }

  // اسم الفيلم كنص بس (مش HTML)
  document.getElementById("title").textContent = movieTitle || "التريلر";
  if (movieTitle) document.title = movieTitle + " - التريلر";

  // ---- الأزرار ----
  document.getElementById("close").onclick = function () {
    if (tg) tg.close(); else window.close();
  };
  document.getElementById("youtube").onclick = function () {
    if (!validId) return;
    if (tg && tg.openLink) tg.openLink(watchUrl); else window.open(watchUrl, "_blank");
  };

  function showMessage(text, offerYoutube) {
    var box = document.getElementById("msg");
    box.textContent = text;
    box.style.display = "block";
    // "افتح على يوتيوب" بيظهر بس لو الفيديو مش راضي يشتغل هنا
    if (offerYoutube) document.getElementById("youtube").style.display = "block";
  }

  if (!validId) {
    document.getElementById("player").style.display = "none";
    showMessage("رابط التريلر مش صحيح. افتح الفيلم تاني من البوت.", false);
    return;
  }

  // ---- مشغّل يوتيوب (IFrame API عشان نعرف لو يوتيوب رفض التشغيل) ----
  function onPlayerError(event) {
    var code = event && event.data;
    if (code === 101 || code === 150) {
      showMessage("صاحب الفيديو مانع تشغيله برّه يوتيوب. دوس «افتح على يوتيوب» تتفرج عليه هناك.", true);
    } else if (code === 100) {
      showMessage("الفيديو ده اتشال من يوتيوب أو بقى خاص.", false);
    } else {
      showMessage("يوتيوب مش راضي يشغّل الفيديو هنا. دوس «افتح على يوتيوب» تتفرج عليه هناك.", true);
    }
  }

  window.onYouTubeIframeAPIReady = function () {
    playerStarted = true;
    new YT.Player("yt", {
      videoId: videoId,
      width: "100%",
      height: "100%",
      playerVars: { playsinline: 1, rel: 0, modestbranding: 1, autoplay: 1, origin: window.location.origin },
      events: { onError: onPlayerError }
    });
  };

  var api = document.createElement("script");
  api.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(api);

  // لو مكتبة يوتيوب ما حمّلتش: مشغّل عادي
  setTimeout(function () {
    if (playerStarted) return;
    var frame = document.createElement("iframe");
    frame.src = "https://www.youtube.com/embed/" + videoId +
      "?playsinline=1&rel=0&autoplay=1&origin=" + encodeURIComponent(window.location.origin);
    frame.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    frame.allowFullscreen = true;
    var holder = document.getElementById("yt");
    holder.parentNode.replaceChild(frame, holder);
  }, 7000);
})();
</script>
</body>
</html>
