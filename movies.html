<!DOCTYPE html>
<!--
  CFTRadar - صفحة الأفلام (Telegram Mini App)
  البوت بيرفعها لوحده على GitHub Pages، وبيرفع بيانات الأفلام والمواعيد على فرع data:
      movies.html?c=<eg|ae>&s=<s|c>&d=<رابط فولدر البيانات>
  الألوان من شعار CFTRadar بس: أسود + ذهبي + كريمي (الفشار) + أحمر/أزرق (النظارة).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CFTRadar</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #070707; --surface: #121110; --surface-2: #1b1916; --line: #2a2620;
    --gold: #f0c048; --gold-2: #ffd970; --gold-deep: #c8871a;
    --cream: #f3e8cf; --text: #f6f1e6; --muted: #a59d8c;
    --red: #d80000; --blue: #1e6fff;
    --gold-grad: linear-gradient(135deg, #ffd970 0%, #f0c048 45%, #c8871a 100%);
    --glasses: linear-gradient(90deg, var(--blue), var(--red));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; }
  input { font: inherit; }
  .ltr { unicode-bidi: plaintext; }
  .screen { display: none; }
  .screen.on { display: block; }
  svg.i { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- أعلام مرسومة (ويندوز ما بيعرضش إيموجي الأعلام) ---------- */
  .flag { display: inline-block; width: 22px; height: 15px; border-radius: 3px; vertical-align: -2px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.18); flex: none; }
  .flag.eg { background: linear-gradient(#ce1126 0 33.4%, #fff 33.4% 66.6%, #111 66.6%); }
  .flag.ae { background: linear-gradient(90deg, #ef3340 0 26%, transparent 26%),
                         linear-gradient(#00843d 0 33.4%, #fff 33.4% 66.6%, #111 66.6%); }
  .flag.xx { background: var(--surface-2); }

  /* ---------- الهيدر ---------- */
  header { position: sticky; top: 0; z-index: 5; background: rgba(7,7,7,.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 12px 14px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 14px rgba(240,192,72,.35); }
  .brand .name { font-weight: 800; font-size: 21px; letter-spacing: .3px; direction: ltr; }
  .brand .name b { color: var(--cream); } .brand .name span { color: var(--gold); }
  .head-actions { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
  .country-btn { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--cream);
    background: var(--surface); border: 1px solid var(--line); padding: 6px 11px; border-radius: 99px; }
  .country-btn .caret { color: var(--gold); font-size: 10px; }
  .avatar-btn { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 1.5px solid rgba(240,192,72,.6);
    display: grid; place-items: center; background: var(--surface); color: var(--gold); font-weight: 800; }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
  .tabs { display: flex; gap: 8px; margin: 12px 0 0; }
  .tab { flex: 1; padding: 10px 4px; border-radius: 12px; background: var(--surface); color: var(--muted);
    font-weight: 700; font-size: 14px; border: 1px solid var(--line); white-space: nowrap; }
  .tab.active { background: var(--gold-grad); color: #1a1205; border-color: transparent; box-shadow: 0 4px 18px rgba(240,192,72,.25); }
  .tab small { font-weight: 600; opacity: .8; }
  .glasses-line { height: 3px; margin: 12px -14px 0; background: var(--glasses); opacity: .55; }

  /* ---------- شبكة الأفلام + تحريك 3D ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 14px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  /* بوسترات 3D زي 3d-tilt.html: الكارت بيميل مع الماوس/الصباع + لمعة + عناصر بارزة بأعماق مختلفة */
  .card { position: relative; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
    text-align: right; padding: 0; cursor: pointer; transform-style: preserve-3d;
    transition: transform .12s ease-out, box-shadow .4s ease; box-shadow: 0 14px 30px rgba(0,0,0,.45);
    animation: rise .45s ease backwards; }       /* backwards: ما بتمسكش آخر حالة فما بتغطيش على الميلان */
  .card:hover, .card.tilting { box-shadow: 0 25px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(240,192,72,.3); }
  .card.reset { transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease; }
  .card .glare { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,240,205,.30), transparent 45%);
    opacity: 0; transition: opacity .3s ease; }
  .card:hover .glare, .card.tilting .glare { opacity: 1; }
  .card img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: var(--surface-2);
    border-radius: 13px 13px 0 0; transform: translateZ(0); }
  .card .info { padding: 8px 10px 10px; transform-style: preserve-3d; }
  .card .title { font-weight: 700; font-size: 14px; line-height: 1.35; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; transform: translateZ(40px); }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; transform: translateZ(25px); }
  .badge { position: absolute; top: 8px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; z-index: 2;
    transform: translateZ(60px); }
  .badge.rating { left: 8px; background: rgba(7,7,7,.75); color: var(--gold); border: 1px solid rgba(240,192,72,.55); }
  .badge.book { right: 8px; background: var(--gold-grad); color: #1a1205; }
  .badge.where { left: 8px; top: 36px; padding: 3px 6px; background: rgba(7,7,7,.75); }   /* تحت التصنيف، على البوستر */
  .btn.unwatch { color: #ff8a80; border: 1.5px solid rgba(216,0,0,.55); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card, .card.reset, .card .glare { transition: none !important; animation: none; } }
  .empty, .error { text-align: center; color: var(--muted); padding: 60px 24px; line-height: 1.8; white-space: pre-line; }
  .skeleton { border-radius: 14px; aspect-ratio: 2 / 3.45; background:
    linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
    background-size: 300% 100%; animation: shine 1.3s infinite; }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* ---------- صفحة الفيلم ---------- */
  .hero { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; overflow: hidden; }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(7,7,7,.15) 0%, rgba(7,7,7,.35) 55%, var(--bg) 100%); }
  .hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; }
  .play { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; color: var(--cream); }
  .play .circle { width: 70px; height: 70px; border-radius: 50%; background: var(--gold-grad); display: grid; place-items: center;
    box-shadow: 0 0 0 6px rgba(240,192,72,.18), 0 8px 26px rgba(240,192,72,.35); }
  .play .circle::before { content: ""; margin-left: 7px; border-style: solid; border-width: 13px 0 13px 21px;
    border-color: transparent transparent transparent #1a1205; }
  .play span { font-weight: 700; font-size: 13px; text-shadow: 0 1px 6px #000; }
  .add-trailer { position: absolute; z-index: 4; inset: auto 12px 14px 12px; display: none; }
  .add-trailer .open { width: 100%; padding: 10px; border-radius: 12px; background: rgba(7,7,7,.75);
    border: 1.5px dashed rgba(240,192,72,.7); color: var(--gold); font-weight: 700; }
  .add-trailer form { display: none; gap: 8px; }
  .add-trailer.editing .open { display: none; }
  .add-trailer.editing form { display: flex; }
  .add-trailer input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(240,192,72,.6);
    background: rgba(7,7,7,.85); color: var(--text); direction: ltr; }
  .add-trailer .link { padding: 10px 16px; border-radius: 12px; background: var(--gold-grad); color: #1a1205; font-weight: 800; }
  .add-trailer .hint { color: #ff8a80; font-size: 12px; margin-top: 6px; text-shadow: 0 1px 4px #000; }
  .body { padding: 4px 16px 28px; margin-top: -18px; position: relative; z-index: 4; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.3; color: var(--cream); }
  .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 13px; padding: 4px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
  .chip.gold { color: var(--gold); border-color: rgba(240,192,72,.5); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 13px 10px; border-radius: 14px; font-weight: 800; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--gold-grad); color: #1a1205; box-shadow: 0 6px 22px rgba(240,192,72,.28); }
  .btn.outline { color: var(--gold); border: 1.5px solid rgba(240,192,72,.6); }
  .btn.note { background: var(--surface); color: var(--muted); font-weight: 600; font-size: 14px; cursor: default; }
  .desc { margin-top: 16px; color: #d8d2c4; line-height: 1.9; font-size: 15px; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { -webkit-line-clamp: unset; display: block; }
  .more { color: var(--gold); font-weight: 700; padding: 4px 0; }
  .section-title { margin: 22px 0 10px; font-size: 17px; font-weight: 800; color: var(--cream); display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--gold-grad); }
  .details { border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row .k { color: var(--muted); white-space: nowrap; }
  .row .v { text-align: left; font-weight: 600; }

  /* ---------- المواعيد والحجز ---------- */
  .st-head { padding: 16px 16px 6px; }
  .st-head h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--cream); }
  .st-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .scroller { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  .pill { flex: none; padding: 7px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line);
    color: var(--muted); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pill.active { background: var(--gold-grad); color: #1a1205; border-color: transparent; }
  .pill.small { font-size: 12.5px; padding: 6px 12px; }
  .pill.small.active { background: transparent; color: var(--gold); border-color: rgba(240,192,72,.7); }
  .cinema { margin: 10px 16px 14px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  .cinema h3 { margin: 0 0 10px; font-size: 16.5px; font-weight: 800; color: var(--cream); display: flex; gap: 8px; align-items: center; }
  .cinema h3::before { content: ""; width: 18px; height: 3px; border-radius: 2px; background: var(--glasses); }
  .screen-type { color: var(--muted); font-size: 13px; font-weight: 700; margin: 8px 0 7px; }
  .times { display: flex; flex-wrap: wrap; gap: 8px; }
  .time { position: relative; padding: 7px 14px; border-radius: 9px; font-weight: 800; font-size: 14px; direction: ltr;
    color: var(--gold); border: 1.5px solid rgba(240,192,72,.65); background: rgba(240,192,72,.06); }
  .time::before, .time::after { content: ""; position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px;
    border-radius: 50%; background: var(--surface); border: 1.5px solid rgba(240,192,72,.65); }
  .time::before { left: -5px; clip-path: inset(0 0 0 50%); } .time::after { right: -5px; clip-path: inset(0 50% 0 0); }
  .time:active { background: var(--gold-grad); color: #1a1205; }
  .time.full { color: #6e675a; border-color: #3a352c; background: none; text-decoration: line-through; cursor: default; }
  .time.full::before, .time.full::after { border-color: #3a352c; }

  /* ---------- الدخول + حسابي ---------- */
  .login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 22px; text-align: center;
    background: radial-gradient(circle at 50% 25%, rgba(240,192,72,.16), transparent 55%), var(--bg); }
  .login .logo { width: 116px; height: 116px; border-radius: 50%; box-shadow: 0 0 40px rgba(240,192,72,.35); }
  .login h2 { margin: 18px 0 4px; font-size: 26px; font-weight: 800; direction: ltr; }
  .login h2 b { color: var(--cream); } .login h2 span { color: var(--gold); }
  .login p { margin: 0; color: var(--muted); line-height: 1.8; }
  .who { margin: 22px 0 6px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line); }
  .who .pic { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
    background: var(--gold-grad); color: #1a1205; font-weight: 800; font-size: 20px; flex: none; }
  .who .pic img { width: 100%; height: 100%; object-fit: cover; }
  .who .n { font-weight: 800; text-align: right; } .who .u { color: var(--muted); font-size: 13px; direction: ltr; text-align: right; }
  .choose { margin: 18px 0 8px; color: var(--cream); font-weight: 700; }
  .country-list { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .country-opt { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 14px;
    background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; }
  .country-opt.active { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 3px rgba(240,192,72,.12); }
  .login .btn { flex: none; margin-top: 24px; width: 100%; max-width: 360px; }
  .profile { padding: 18px 16px 30px; }
  .profile h2 { margin: 0 0 14px; font-size: 24px; font-weight: 800; color: var(--cream); }
  .p-card { padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; }
  .p-top { display: flex; align-items: center; gap: 14px; }
  .p-top .pic { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
    background: var(--gold-grad); color: #1a1205; font-weight: 800; font-size: 26px; flex: none;
    box-shadow: 0 0 0 2px rgba(240,192,72,.5); }
  .p-top .pic img { width: 100%; height: 100%; object-fit: cover; }
  .p-top .n { font-size: 20px; font-weight: 800; } .p-top .u { color: var(--muted); direction: ltr; text-align: right; }
  .tag { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 99px;
    background: var(--gold-grad); color: #1a1205; }
  .p-label { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .p-card .btn { width: 100%; margin-top: 12px; }
  .logout { display: block; margin: 6px auto 0; color: var(--muted); font-size: 14px; padding: 8px; }
</style>
</head>
<body>

<!-- ============ الدخول (أول مرة) ============ -->
<section class="screen" id="s-login">
  <div class="login">
    <img class="logo" src="logo.png" alt="">
    <h2><b>CFT</b><span>Radar</span></h2>
    <div class="who" id="login-who"></div>
    <div class="choose">انت منين؟</div>
    <div class="country-list" id="login-countries"></div>
    <button class="btn primary" id="login-go"></button>
  </div>
</section>

<!-- ============ القايمة ============ -->
<header id="top">
  <div class="brand">
    <img src="logo.png" alt="">
    <div class="name"><b>CFT</b><span>Radar</span></div>
    <div class="head-actions">
      <button class="country-btn" id="country-btn"></button>
      <button class="avatar-btn" id="avatar-btn"></button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab" data-s="s">يعرض دلوقتي <small id="count-s"></small></button>
    <button class="tab" data-s="c">يعرض قريبًا <small id="count-c"></small></button>
    <button class="tab" data-s="w">مراقباتي <small id="count-w"></small></button>
  </div>
  <div class="glasses-line"></div>
</header>
<section class="screen" id="s-list"><div class="grid" id="grid"></div></section>

<!-- ============ الفيلم ============ -->
<section class="screen" id="s-detail">
  <div class="hero" id="hero">
    <button class="play" id="play"><div class="circle"></div><span>شغّل التريلر</span></button>
    <div class="add-trailer" id="add-trailer">
      <button class="open" id="add-open"></button>
      <form id="add-form" autocomplete="off" novalidate>
        <input id="add-url" type="url" placeholder="https://youtu.be/..." inputmode="url">
        <button class="link" type="submit">ربط</button>
      </form>
      <div class="hint" id="add-hint"></div>
    </div>
  </div>
  <div class="body">
    <h1 class="ltr" id="d-title"></h1>
    <div class="meta" id="d-meta"></div>
    <div class="chips" id="d-chips"></div>
    <div class="actions" id="d-actions"></div>
    <div class="desc ltr" id="d-desc"></div>
    <button class="more" id="d-more">عرض المزيد</button>
    <div class="section-title">التفاصيل</div>
    <div class="details" id="d-details"></div>
  </div>
</section>

<!-- ============ المواعيد والحجز ============ -->
<section class="screen" id="s-times">
  <div class="st-head"><h2 class="ltr" id="t-title"></h2><p>اختار الميعاد وهيفتحلك صفحة الحجز بتاعته</p></div>
  <div class="scroller" id="t-days"></div>
  <div class="scroller" id="t-cinemas"></div>
  <div id="t-list"></div>
</section>

<!-- ============ حسابي ============ -->
<section class="screen" id="s-profile">
  <div class="profile">
    <h2>حسابي</h2>
    <div class="p-card"><div class="p-top" id="p-top"></div></div>
    <div class="p-card">
      <div class="p-label">أفلام أنهي بلد؟</div>
      <div class="country-list" id="p-countries" style="justify-content:flex-start"></div>
      <button class="btn outline" id="p-alerts"></button>
    </div>
    <button class="logout" id="p-logout">تسجيل خروج</button>
  </div>
</section>

<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;
  var q = new URLSearchParams(location.search);
  var country = (q.get("c") || "eg").replace(/[^a-z]/g, "");
  var section = /^(c|w)$/.test(q.get("s") || "") ? q.get("s") : "s";
  // من التنبيه: الصفحة بتفتح على الفيلم على طول (v=t مواعيده، v=d صفحته)
  var target = /^\d+$/.test(q.get("m") || "") ? { m: q.get("m"), v: q.get("v") === "t" ? "t" : "d" } : null;
  var dataBase = (q.get("d") || "").replace(/\/$/, "");
  var DATA = null, CACHE = {}, current = null, stack = [];
  var user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  // من زرار الكيبورد تيليجرام ما بيبعتش بيانات المستخدم -> البوت بيحط الاسم في اللينك
  if (!user && (q.get("n") || q.get("u"))) user = { first_name: q.get("n") || "", username: q.get("u") || "" };
  // مراقباتي: أرقام الأفلام من البوت (في اللينك) + اللي اتغير هنا لحد ما البوت يحدث اللينك
  var urlWatch = (q.get("w") || "").split(",").filter(function (x) { return /^\d+$/.test(x); });
  var $ = function (id) { return document.getElementById(id); };
  var ICON = {

  function tilt(card) {                                 // نفس 3d-tilt.html: ميلان لحد 10° + لمعة بتتبع الماوس/الصباع
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var glare = el("div", "glare"); card.appendChild(glare);
    function move(x, y) {
      var r = card.getBoundingClientRect();
      var px = Math.min(1, Math.max(0, (x - r.left) / r.width)), py = Math.min(1, Math.max(0, (y - r.top) / r.height));
      card.classList.remove("reset"); card.classList.add("tilting");
      // المنظور جوه الكارت نفسه: كل كارت بيتحسب من نصه هو (مش من نص الشاشة)
      card.style.transform = "perspective(900px) rotateY(" + ((px - 0.5) * 20) + "deg) rotateX(" + ((0.5 - py) * 20) + "deg)";
      card.style.setProperty("--gx", (px * 100) + "%"); card.style.setProperty("--gy", (py * 100) + "%");
    }

    card.addEventListener("mousemove", function (e) { move(e.clientX, e.clientY); });

  function watchItems(done) {                           // الأفلام اللي بتراقبها في كل البلاد

    for (var i = 0; i < 2; i++) { var sk = el("div", "skeleton cinema"); sk.style.aspectRatio = "auto"; sk.style.height = "130px"; list.appendChild(sk); }
    go("s-times");
    fetch(dataBase + "/" + country + "/st/" + m.id + ".json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        TIMES = data; timesDay = (data.days[0] || {}).key;
        store.get("cinema_" + country, function (v) { timesCinema = v || ""; renderTimes(); });
      })
      .catch(function () { list.textContent = ""; list.appendChild(el("div", "error", "مش قادر أجيب المواعيد دلوقتي.\nجرب تاني كمان شوية.")); });
  }
  function renderTimes() {
    var days = $("t-days"); days.textContent = "";
    TIMES.days.forEach(function (d) {
      var b = el("button", "pill" + (d.key === timesDay ? " active" : ""), d.label);
      b.onclick = function () { haptic(); timesDay = d.key; renderTimes(); };
      days.appendChild(b);
    });
    var cinemas = TIMES.byDay[timesDay] || [];
    var names = cinemas.map(function (c) { return c.cinema; });
    if (timesCinema && names.indexOf(timesCinema) < 0) timesCinema = "";
    var bar = $("t-cinemas"); bar.textContent = "";
    if (names.length > 1) {                              // سينمتك: بتتفتكر للمرة الجاية
      [""].concat(names).forEach(function (n) {
        var b = el("button", "pill small" + (n === timesCinema ? " active" : ""), n || "كل السينمات");
        b.onclick = function () { haptic(); timesCinema = n; store.set("cinema_" + country, n); renderTimes(); };
        bar.appendChild(b);
      });
    }
    var list = $("t-list"); list.textContent = "";
    cinemas.filter(function (c) { return !timesCinema || c.cinema === timesCinema; }).forEach(function (c) {
      var box = el("div", "cinema"); box.appendChild(el("h3", "ltr", c.cinema));
      c.screens.forEach(function (sc) {
        if (sc.type) box.appendChild(el("div", "screen-type ltr", sc.type));
        var times = el("div", "times");
        sc.times.forEach(function (t) {
          var b = el("button", "time" + (t[1] ? "" : " full"), t[0]);
          if (t[1]) b.onclick = function () {
            haptic("medium");
            if (tg && tg.openLink) tg.openLink(t[1]); else window.open(t[1], "_blank");
          };
          else b.title = "كامل";
          times.appendChild(b);
        });
        box.appendChild(times);
      });
      list.appendChild(box);
    });
    if (!list.childNodes.length) list.appendChild(el("div", "empty", "مفيش عروض في اليوم ده."));
  }

  // ---------- تحميل البيانات ----------
  function loadCountry(code, done) {
    if (CACHE[code]) { DATA = CACHE[code]; country = code; done && done(); return; }
    fetch(dataBase + "/" + code + ".json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) { CACHE[code] = data; DATA = data; country = code; done && done(); })
      .catch(function () {
        if (!DATA) { show("s-list"); $("grid").textContent = ""; $("grid").style.display = "block";
          $("grid").appendChild(el("div", "error", "مش قادر أجيب الأفلام دلوقتي.\nاقفل الصفحة وافتحها تاني كمان شوية.")); }
      });
  }
  (function start() {
    var grid = $("grid");
    for (var i = 0; i < 6; i++) grid.appendChild(el("div", "skeleton"));
    show("s-list");
    // البيانات من https بس (أو من جهازك للتجربة)
    if (!/^(https:\/\/|http:\/\/(127\.0\.0\.1|localhost)[:\/])/.test(dataBase)) {
      grid.textContent = ""; grid.appendChild(el("div", "error", "افتح الصفحة من البوت.")); return;
    }
    store.get("country", function (saved) {
      // من تنبيه: بلد الفيلم (اللي في اللينك) هي اللي تمشي - غير كده آخر بلد كنت بتتفرج عليها
      if (!target && saved && /^[a-z]{2}$/.test(saved)) country = saved;
      loadCountry(country, function () {
        store.get("login", function (login) {
          renderHeader();
          if (!login) { renderLogin(); show("s-login"); return; }       // أول مرة: الدخول
          setTab(section); show("s-list"); openTarget();
        });
      });
    });
  })();
})();
</script>
</body>
</html>
