<!DOCTYPE html>
<!--
  CFTRadar - صفحة الأفلام (Telegram Mini App)
  البوت بيرفعها لوحده على GitHub Pages، وبيرفع بيانات الأفلام والمواعيد على فرع data:
      movies.html?c=<eg|ae>&s=<s|c>&d=<رابط فولدر البيانات>
  الألوان من شعار CFTRadar بس: أسود + ذهبي + كريمي (الفشار) + أحمر/أزرق (النظارة).
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>CFTRadar</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #070707; --surface: #121110; --surface-2: #1b1916; --line: #2a2620;
    --gold: #f0c048; --gold-2: #ffd970; --gold-deep: #c8871a;
    --cream: #f3e8cf; --text: #f6f1e6; --muted: #a59d8c;
    --red: #d80000; --blue: #1e6fff;
    --gold-grad: linear-gradient(135deg, #ffd970 0%, #f0c048 45%, #c8871a 100%);
    --glasses: linear-gradient(90deg, var(--blue), var(--red));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Cairo", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
  body { min-height: 100vh; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; }
  input { font: inherit; }
  .ltr { unicode-bidi: plaintext; }
  .screen { display: none; }
  .screen.on { display: block; }
  svg.i { width: 1.15em; height: 1.15em; vertical-align: -0.2em; fill: none; stroke: currentColor;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- أعلام مرسومة (ويندوز ما بيعرضش إيموجي الأعلام) ---------- */
  .flag { display: inline-block; width: 22px; height: 15px; border-radius: 3px; vertical-align: -2px;
    box-shadow: 0 0 0 1px rgba(255,255,255,.18); flex: none; }
  .flag.eg { background: linear-gradient(#ce1126 0 33.4%, #fff 33.4% 66.6%, #111 66.6%); }
  .flag.ae { background: linear-gradient(90deg, #ef3340 0 26%, transparent 26%),
                         linear-gradient(#00843d 0 33.4%, #fff 33.4% 66.6%, #111 66.6%); }
  .flag.xx { background: var(--surface-2); }

  /* ---------- الهيدر ---------- */
  header { position: sticky; top: 0; z-index: 5; background: rgba(7,7,7,.92);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 12px 14px 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 40px; height: 40px; border-radius: 50%; box-shadow: 0 0 14px rgba(240,192,72,.35); }
  .brand .name { font-weight: 800; font-size: 21px; letter-spacing: .3px; direction: ltr; }
  .brand .name b { color: var(--cream); } .brand .name span { color: var(--gold); }
  .head-actions { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
  .country-btn { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--cream);
    background: var(--surface); border: 1px solid var(--line); padding: 6px 11px; border-radius: 99px; }
  .country-btn .caret { color: var(--gold); font-size: 10px; }
  .avatar-btn { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 1.5px solid rgba(240,192,72,.6);
    display: grid; place-items: center; background: var(--surface); color: var(--gold); font-weight: 800; }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
  .tabs { display: flex; gap: 8px; margin: 12px 0 0; }
  .tab { flex: 1; padding: 10px 4px; border-radius: 12px; background: var(--surface); color: var(--muted);
    font-weight: 700; font-size: 14px; border: 1px solid var(--line); white-space: nowrap; }
  .tab.active { background: var(--gold-grad); color: #1a1205; border-color: transparent; box-shadow: 0 4px 18px rgba(240,192,72,.25); }
  .tab small { font-weight: 600; opacity: .8; }
  .glasses-line { height: 3px; margin: 12px -14px 0; background: var(--glasses); opacity: .55; }

  /* ---------- شبكة الأفلام + تحريك 3D ---------- */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; padding: 14px; }
  @media (min-width: 560px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  /* بوسترات 3D زي 3d-tilt.html: الكارت بيميل مع الماوس/الصباع + لمعة + عناصر بارزة بأعماق مختلفة */
  .card { position: relative; border-radius: 14px; background: var(--surface); border: 1px solid var(--line);
    text-align: right; padding: 0; cursor: pointer; transform-style: preserve-3d;
    transition: transform .12s ease-out, box-shadow .4s ease; box-shadow: 0 14px 30px rgba(0,0,0,.45);
    animation: rise .45s ease backwards; }       /* backwards: ما بتمسكش آخر حالة فما بتغطيش على الميلان */
  .card:hover, .card.tilting { box-shadow: 0 25px 50px rgba(0,0,0,.6), 0 0 0 1px rgba(240,192,72,.3); }
  .card.reset { transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease; }
  .card .glare { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at var(--gx, 50%) var(--gy, 50%), rgba(255,240,205,.30), transparent 45%);
    opacity: 0; transition: opacity .3s ease; }
  .card:hover .glare, .card.tilting .glare { opacity: 1; }
  .card img { display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover; background: var(--surface-2);
    border-radius: 13px 13px 0 0; transform: translateZ(0); }
  .card .info { padding: 8px 10px 10px; transform-style: preserve-3d; }
  .card .title { font-weight: 700; font-size: 14px; line-height: 1.35; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 38px; transform: translateZ(40px); }
  .card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; transform: translateZ(25px); }
  .badge { position: absolute; top: 8px; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; z-index: 2;
    transform: translateZ(60px); }
  .badge.rating { left: 8px; background: rgba(7,7,7,.75); color: var(--gold); border: 1px solid rgba(240,192,72,.55); }
  .badge.book { right: 8px; background: var(--gold-grad); color: #1a1205; }
  .badge.where { left: 8px; top: 36px; padding: 3px 6px; background: rgba(7,7,7,.75); }   /* تحت التصنيف، على البوستر */
  .btn.unwatch { color: #ff8a80; border: 1.5px solid rgba(216,0,0,.55); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card, .card.reset, .card .glare { transition: none !important; animation: none; } }
  .empty, .error { text-align: center; color: var(--muted); padding: 60px 24px; line-height: 1.8; white-space: pre-line; }
  .skeleton { border-radius: 14px; aspect-ratio: 2 / 3.45; background:
    linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
    background-size: 300% 100%; animation: shine 1.3s infinite; }
  @keyframes shine { from { background-position: 100% 0; } to { background-position: 0 0; } }

  /* ---------- صفحة الفيلم ---------- */
  .hero { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000 center / cover no-repeat; overflow: hidden; }
  .hero::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(7,7,7,.15) 0%, rgba(7,7,7,.35) 55%, var(--bg) 100%); }
  .hero iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; }
  .play { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 10px; color: var(--cream); }
  .play .circle { width: 70px; height: 70px; border-radius: 50%; background: var(--gold-grad); display: grid; place-items: center;
    box-shadow: 0 0 0 6px rgba(240,192,72,.18), 0 8px 26px rgba(240,192,72,.35); }
  .play .circle::before { content: ""; margin-left: 7px; border-style: solid; border-width: 13px 0 13px 21px;
    border-color: transparent transparent transparent #1a1205; }
  .play span { font-weight: 700; font-size: 13px; text-shadow: 0 1px 6px #000; }
  .add-trailer { position: absolute; z-index: 4; inset: auto 12px 14px 12px; display: none; }
  .add-trailer .open { width: 100%; padding: 10px; border-radius: 12px; background: rgba(7,7,7,.75);
    border: 1.5px dashed rgba(240,192,72,.7); color: var(--gold); font-weight: 700; }
  .add-trailer form { display: none; gap: 8px; }
  .add-trailer.editing .open { display: none; }
  .add-trailer.editing form { display: flex; }
  .add-trailer input { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(240,192,72,.6);
    background: rgba(7,7,7,.85); color: var(--text); direction: ltr; }
  .add-trailer .link { padding: 10px 16px; border-radius: 12px; background: var(--gold-grad); color: #1a1205; font-weight: 800; }
  .add-trailer .hint { color: #ff8a80; font-size: 12px; margin-top: 6px; text-shadow: 0 1px 4px #000; }
  .body { padding: 4px 16px 28px; margin-top: -18px; position: relative; z-index: 4; }
  h1 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.3; color: var(--cream); }
  .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 13px; padding: 4px 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
  .chip.gold { color: var(--gold); border-color: rgba(240,192,72,.5); }
  .actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; padding: 13px 10px; border-radius: 14px; font-weight: 800; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--gold-grad); color: #1a1205; box-shadow: 0 6px 22px rgba(240,192,72,.28); }
  .btn.outline { color: var(--gold); border: 1.5px solid rgba(240,192,72,.6); }
  .btn.note { background: var(--surface); color: var(--muted); font-weight: 600; font-size: 14px; cursor: default; }
  .desc { margin-top: 16px; color: #d8d2c4; line-height: 1.9; font-size: 15px; display: -webkit-box;
    -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .desc.open { -webkit-line-clamp: unset; display: block; }
  .more { color: var(--gold); font-weight: 700; padding: 4px 0; }
  .section-title { margin: 22px 0 10px; font-size: 17px; font-weight: 800; color: var(--cream); display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ""; width: 4px; height: 18px; border-radius: 2px; background: var(--gold-grad); }
  .details { border-top: 1px solid var(--line); }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row .k { color: var(--muted); white-space: nowrap; }
  .row .v { text-align: left; font-weight: 600; }

  /* ---------- المواعيد والحجز ---------- */
  .st-head { padding: 16px 16px 6px; }
  .st-head h2 { margin: 0; font-size: 20px; font-weight: 800; color: var(--cream); }
  .st-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .scroller { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  .pill { flex: none; padding: 7px 14px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line);
    color: var(--muted); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .pill.active { background: var(--gold-grad); color: #1a1205; border-color: transparent; }
  .pill.small { font-size: 12.5px; padding: 6px 12px; }
  .pill.small.active { background: transparent; color: var(--gold); border-color: rgba(240,192,72,.7); }
  .cinema { margin: 10px 16px 14px; padding: 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); }
  .cinema h3 { margin: 0 0 10px; font-size: 16.5px; font-weight: 800; color: var(--cream); display: flex; gap: 8px; align-items: center; }
  .cinema h3::before { content: ""; width: 18px; height: 3px; border-radius: 2px; background: var(--glasses); }
  .screen-type { color: var(--muted); font-size: 13px; font-weight: 700; margin: 8px 0 7px; }
  .times { display: flex; flex-wrap: wrap; gap: 8px; }
  .time { position: relative; padding: 7px 14px; border-radius: 9px; font-weight: 800; font-size: 14px; direction: ltr;
    color: var(--gold); border: 1.5px solid rgba(240,192,72,.65); background: rgba(240,192,72,.06); }
  .time::before, .time::after { content: ""; position: absolute; top: 50%; width: 8px; height: 8px; margin-top: -4px;
    border-radius: 50%; background: var(--surface); border: 1.5px solid rgba(240,192,72,.65); }
  .time::before { left: -5px; clip-path: inset(0 0 0 50%); } .time::after { right: -5px; clip-path: inset(0 50% 0 0); }
  .time:active { background: var(--gold-grad); color: #1a1205; }
  .time.full { color: #6e675a; border-color: #3a352c; background: none; text-decoration: line-through; cursor: default; }
  .time.full::before, .time.full::after { border-color: #3a352c; }

  /* ---------- الدخول + حسابي ---------- */
  .login { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 22px; text-align: center;
    background: radial-gradient(circle at 50% 25%, rgba(240,192,72,.16), transparent 55%), var(--bg); }
  .login .logo { width: 116px; height: 116px; border-radius: 50%; box-shadow: 0 0 40px rgba(240,192,72,.35); }
  .login h2 { margin: 18px 0 4px; font-size: 26px; font-weight: 800; direction: ltr; }
  .login h2 b { color: var(--cream); } .login h2 span { color: var(--gold); }
  .login p { margin: 0; color: var(--muted); line-height: 1.8; }
  .who { margin: 22px 0 6px; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line); }
  .who .pic { width: 46px; height: 46px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
    background: var(--gold-grad); color: #1a1205; font-weight: 800; font-size: 20px; flex: none; }
  .who .pic img { width: 100%; height: 100%; object-fit: cover; }
  .who .n { font-weight: 800; text-align: right; } .who .u { color: var(--muted); font-size: 13px; direction: ltr; text-align: right; }
  .choose { margin: 18px 0 8px; color: var(--cream); font-weight: 700; }
  .country-list { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .country-opt { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 14px;
    background: var(--surface); border: 1.5px solid var(--line); font-weight: 700; }
  .country-opt.active { border-color: var(--gold); color: var(--gold); box-shadow: 0 0 0 3px rgba(240,192,72,.12); }
  .login .btn { flex: none; margin-top: 24px; width: 100%; max-width: 360px; }
  .profile { padding: 18px 16px 30px; }
  .profile h2 { margin: 0 0 14px; font-size: 24px; font-weight: 800; color: var(--cream); }
  .p-card { padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); margin-bottom: 14px; }
  .p-top { display: flex; align-items: center; gap: 14px; }
  .p-top .pic { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
    background: var(--gold-grad); color: #1a1205; font-weight: 800; font-size: 26px; flex: none;
    box-shadow: 0 0 0 2px rgba(240,192,72,.5); }
  .p-top .pic img { width: 100%; height: 100%; object-fit: cover; }
  .p-top .n { font-size: 20px; font-weight: 800; } .p-top .u { color: var(--muted); direction: ltr; text-align: right; }
  .tag { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 99px;
    background: var(--gold-grad); color: #1a1205; }
  .p-label { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .p-card .btn { width: 100%; margin-top: 12px; }
  .logout { display: block; margin: 6px auto 0; color: var(--muted); font-size: 14px; padding: 8px; }

  /* ---------- الملف الشخصي (مستوحى من Discord بهوية CFTRadar) ---------- */
  .pf { --pf-accent: #f0c048; --pf-bg: linear-gradient(135deg, #2a1d06, #0b0905); position: relative;
    margin: 0 0 14px; border-radius: 20px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
  .pf[data-preset="crimson"]  { --pf-bg: linear-gradient(135deg, #2b0709, #0b0505); }
  .pf[data-preset="ocean"]    { --pf-bg: linear-gradient(135deg, #061b2e, #05080c); }
  .pf[data-preset="violet"]   { --pf-bg: linear-gradient(135deg, #1d1033, #08060c); }
  .pf[data-preset="emerald"]  { --pf-bg: linear-gradient(135deg, #05261b, #050a08); }
  .pf[data-preset="midnight"] { --pf-bg: linear-gradient(135deg, #11161f, #050608); }
  .pf-cover { height: 132px; background: var(--pf-bg) center / cover no-repeat; position: relative; overflow: hidden; }
  .pf[data-effect="sparkle"] .pf-cover::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.18) 45%, transparent 60%);
    background-size: 250% 100%; animation: pf-shine 3.2s ease-in-out infinite; }
  @keyframes pf-shine { from { background-position: 150% 0; } to { background-position: -50% 0; } }
  .pf-head { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px; margin-top: -46px; }
  .pf-avatar { width: 92px; height: 92px; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
    background: var(--gold-grad); color: #1a1205; font-weight: 800; font-size: 36px; position: relative;
    border: 5px solid var(--surface); box-shadow: 0 0 0 2px var(--pf-accent); }
  .pf-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .pf[data-effect="glow"] .pf-avatar { animation: pf-glow 2.6s ease-in-out infinite; }
  @keyframes pf-glow { 0%, 100% { box-shadow: 0 0 0 2px var(--pf-accent), 0 0 10px var(--pf-accent); }
                       50% { box-shadow: 0 0 0 2px var(--pf-accent), 0 0 26px var(--pf-accent); } }
  .pf-head .btn { flex: none; padding: 8px 14px; font-size: 14px; margin-bottom: 6px; color: var(--pf-accent);
    border-color: var(--pf-accent); }
  .pf-body { padding: 10px 16px 16px; }
  .pf-name { font-size: 22px; font-weight: 800; color: var(--cream); text-align: right; }
  .pf-bio { text-align: right; }
  .pf-user { color: var(--muted); font-size: 14px; direction: ltr; text-align: right; }
  .pf-bio { margin-top: 10px; line-height: 1.8; white-space: pre-line; }
  .pf-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 14px; padding: 12px 6px;
    border-radius: 14px; background: rgba(255,255,255,.03); border: 1px solid var(--line); text-align: center; }
  .pf-stats b { display: block; font-size: 18px; color: var(--pf-accent); }
  .pf-stats span { font-size: 11.5px; color: var(--muted); }
  .pf-badges { margin-top: 12px; color: var(--muted); font-size: 13px; }
  .pf-note { padding: 18px 16px; color: var(--muted); line-height: 1.8; text-align: center; }
  /* تعديل الملف */
  .edit { padding: 18px 16px 30px; }
  .edit h2 { margin: 0 0 14px; font-size: 22px; font-weight: 800; color: var(--cream); }
  .field { margin-bottom: 16px; }
  .field label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 7px; }
  .field input[type=text], .field textarea, .field select { width: 100%; padding: 11px 12px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text); font: inherit; }
  .field textarea { min-height: 84px; resize: vertical; }
  .field .count { float: left; font-size: 12px; color: var(--muted); }
  .media-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .media-row .thumb { width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: var(--surface-2); flex: none; }
  .media-row .thumb.wide { width: 130px; height: 54px; border-radius: 10px; }
  .media-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .mini { padding: 8px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatch { width: 38px; height: 38px; border-radius: 50%; border: 2px solid transparent; }
  .swatch.on { border-color: var(--cream); box-shadow: 0 0 0 3px rgba(240,192,72,.35); }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .edit .msg { min-height: 20px; color: #ff8a80; font-size: 13px; margin: 6px 0; }
  .edit .btn.primary { width: 100%; }

  /* ---------- التقييمات والمراجعات ---------- */

<script>
(function () {
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;
  var q = new URLSearchParams(location.search);
  var country = (q.get("c") || "eg").replace(/[^a-z]/g, "");
  var section = /^(c|w)$/.test(q.get("s") || "") ? q.get("s") : "s";
  // من التنبيه: الصفحة بتفتح على الفيلم على طول (v=t مواعيده، v=d صفحته)
  var target = /^\d+$/.test(q.get("m") || "") ? { m: q.get("m"), v: q.get("v") === "t" ? "t" : "d" } : null;
  var dataBase = (q.get("d") || "").replace(/\/$/, "");
  var DATA = null, CACHE = {}, current = null, stack = [];
  var user = (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) || null;
  // من زرار الكيبورد تيليجرام ما بيبعتش بيانات المستخدم -> البوت بيحط الاسم في اللينك
  if (!user && (q.get("n") || q.get("u"))) user = { first_name: q.get("n") || "", username: q.get("u") || "" };
  // مراقباتي: أرقام الأفلام من البوت (في اللينك) + اللي اتغير هنا لحد ما البوت يحدث اللينك
  var urlWatch = (q.get("w") || "").split(",").filter(function (x) { return /^\d+$/.test(x); });
  var $ = function (id) { return document.getElementById(id); };
  var ICON = {
    ticket: '<svg class="i" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 2-2h14a2 2 0 0 0 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 0-2 2H5a2 2 0 0 0-2-2v-2a2 2 0 0 0 0-4z"/><path d="M14 6v12" stroke-dasharray="2 2"/></svg>',
    eye: '<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
    eyeOff: '<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/></svg>',
    bell: '<svg class="i" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
    plus: '<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
    login: '<svg class="i" viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5M15 12H3"/></svg>'
  };

  function haptic(kind) { try { tg.HapticFeedback.impactOccurred(kind || "light"); } catch (e) {} }
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#070707"); tg.setBackgroundColor("#070707"); } catch (e) {} }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;   // نص بس - أي حاجة جاية من البيانات ما بتتنفذش
    return n;
  }
  function flag(code) { return el("span", "flag " + (/^(eg|ae)$/.test(code) ? code : "xx")); }
  function countryName(code) {
    var list = (DATA && DATA.countries) || [];
    for (var i = 0; i < list.length; i++) if (list[i].code === code) return list[i].name;
    return { eg: "مصر", ae: "الإمارات" }[code] || code;
  }
  function poster(m) { return m.poster || "no_poster.jpg"; }
  function isConcert(m) {                              // البوت للأفلام بس (حتى لو البيانات قديمة)
    return /concert|حفل|كونسير/i.test(m.genre || "") ||
      (m.details || []).some(function (p) { return /concert/i.test(String(p[1] || "")); }) ||
      /world tour|in concert|live viewing|\(live\)|: live\s*$/i.test(m.title || "");
  }
  function listIds(name) {
    return (DATA[name] || []).filter(function (id) { var m = DATA.movies[String(id)]; return m && !isConcert(m); });
  }
  function openTarget() {
    if (!target) return;
    var m = DATA.movies[target.m], view = target.v; target = null;
    if (!m || isConcert(m)) return;
    showDetail(m);
    if (view === "t" && m.bookable) openTimes(m);
  }
  function isAdmin() {                                  // البوت بيعلّم لينك الأدمن (والبوت بيتأكد تاني قبل ما يقبل أي تريلر)
    if (q.get("adm") === "1") return true;
    return !!(user && user.username && DATA && DATA.admin && user.username.toLowerCase() === DATA.admin.toLowerCase());
  }

  // ---------- تخزين (تيليجرام CloudStorage: نفس الحساب على كل الأجهزة، وإلا الجهاز) ----------
  var store = {
    get: function (key, cb) {
      var local = null; try { local = localStorage.getItem("cft_" + key); } catch (e) {}
      try {
        if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9")) {
          tg.CloudStorage.getItem(key, function (err, v) { cb(!err && v ? v : local); }); return;
        }
      } catch (e) {}
      cb(local);
    },
    set: function (key, value) {
      try { localStorage.setItem("cft_" + key, value); } catch (e) {}
      try { if (tg && tg.CloudStorage && tg.isVersionAtLeast("6.9")) tg.CloudStorage.setItem(key, value); } catch (e) {}
    },
    remove: function (key) {
      try { localStorage.removeItem("cft_" + key); } catch (e) {}
      try { if (tg && tg.CloudStorage && tg.isVersionAtLeast("6.9")) tg.CloudStorage.removeItem(key); } catch (e) {}
    }
  };

  // ---------- التنقل بين الشاشات (زرار الرجوع بتاع تيليجرام) ----------
  function show(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.toggle("on", s.id === id); });
    $("top").style.display = (id === "s-list") ? "" : "none";
    window.scrollTo(0, 0);
    if (tg && tg.BackButton) { if (stack.length) tg.BackButton.show(); else tg.BackButton.hide(); }
  }
  function go(id) { stack.push(document.querySelector(".screen.on").id); show(id); }
  function back() {
    var f = $("hero").querySelector("iframe"); if (f) f.remove();
    var to = stack.pop() || "s-list";
    show(to);
    if (to === "s-list" && DATA) { renderHeader(); renderGrid(); }   // المراقبات/البلد ممكن يكونوا اتغيروا
  }
  if (tg && tg.BackButton) tg.BackButton.onClick(function () { haptic(); back(); });

  // ---------- بعت للبوت (الراقب / بلد التنبيهات / تريلر الأدمن) ----------
  function sendToBot(payload, deepLink) {
    haptic("medium");
    // من زرار الكيبورد القديم بس (تيليجرام ما بيبعتش initData هناك): sendData -
    // من زرار «ادخل» جنب خانة الكتابة أو من تنبيه: لينك للبوت (بيشتغل من أي مكان)
    var fromKeyboard = tg && tg.platform && tg.platform !== "unknown" && !tg.initData;
    try { if (fromKeyboard && tg.sendData) { tg.sendData(JSON.stringify(payload)); return; } } catch (e) {}
    if (DATA && DATA.bot) {                  // الصفحة مفتوحة من زرار جوه رسالة: نرجع للبوت بلينك
      var link = "https://t.me/" + DATA.bot + "?start=" + deepLink;
      if (tg && tg.openTelegramLink) { tg.openTelegramLink(link); setTimeout(function () { try { tg.close(); } catch (e) {} }, 400); }
      else location.href = link;
    }
  }

  // ---------- مراقباتي ----------
  var LOCAL = { add: [], del: [] };
  (function () {                                       // البوت حدّث اللينك؟ التغييرات المحلية القديمة ملهاش لازمة
    try {
      var seen = localStorage.getItem("cft_w_seen"), now = urlWatch.join(",");
      if (seen !== now) { localStorage.setItem("cft_w_seen", now); localStorage.removeItem("cft_w_local"); }
      LOCAL = JSON.parse(localStorage.getItem("cft_w_local") || '{"add":[],"del":[]}');
    } catch (e) {}
  })();
  function watchedIds() {
    var ids = urlWatch.concat(LOCAL.add).filter(function (x) { return LOCAL.del.indexOf(x) < 0; });
    return ids.filter(function (x, i) { return ids.indexOf(x) === i; });
  }
  function isWatched(id) { return watchedIds().indexOf(String(id)) >= 0; }
  function setWatched(id, on) {
    id = String(id);
    LOCAL.add = LOCAL.add.filter(function (x) { return x !== id; });
    LOCAL.del = LOCAL.del.filter(function (x) { return x !== id; });
    (on ? LOCAL.add : LOCAL.del).push(id);
    try { localStorage.setItem("cft_w_local", JSON.stringify(LOCAL)); } catch (e) {}
  }

  // ---------- صورة الحساب ----------
  function pic(cls) {
    var p = el("div", cls);
    if (user && user.photo_url) { var im = el("img"); im.src = user.photo_url; im.alt = ""; p.appendChild(im); }
    else p.textContent = ((user && user.first_name) || "؟").trim().charAt(0).toUpperCase();
    return p;
  }
  function fullName() { return user ? [user.first_name, user.last_name].filter(Boolean).join(" ") : "ضيف"; }

  // ---------- الدخول أول مرة ----------
  function renderLogin() {
    var who = $("login-who"); who.textContent = "";
    who.appendChild(pic("pic"));
    var t = el("div"); t.appendChild(el("div", "n ltr", fullName()));
    if (user && user.username) t.appendChild(el("div", "u", "@" + user.username));
    who.appendChild(t);
    renderCountryOptions($("login-countries"), function (code) { country = code; renderLogin(); });
    $("login-go").innerHTML = ICON.login + " ";
    $("login-go").appendChild(document.createTextNode("دخول بحساب تيليجرام"));
  }
  $("login-go").onclick = function () {
    haptic("medium");
    store.set("login", JSON.stringify({ v: 1, at: Date.now() }));
    store.set("country", country);
    loadCountry(country, function () { renderHeader(); setTab(section); show("s-list"); openTarget(); });
  };
  function renderCountryOptions(box, onPick) {
    box.textContent = "";
    var list = (DATA && DATA.countries) || [{ code: "eg", name: "مصر" }, { code: "ae", name: "الإمارات" }];
    list.forEach(function (c) {
      var b = el("button", "country-opt" + (c.code === country ? " active" : ""));
      b.appendChild(flag(c.code)); b.appendChild(el("span", "", c.name));
      b.onclick = function () { haptic(); onPick(c.code); };
      box.appendChild(b);
    });
  }

  // ---------- المجتمع: سيرفر البوت (الحساب بيتعمل لوحده بحساب تيليجرام) ----------
  var ME = null;
  function apiBase() { return (DATA && DATA.api) || ""; }
  function apiReady() { return !!(apiBase() && tg && tg.initData); }
  function call(method, path, body) {
    var opts = { method: method, headers: { "X-Init-Data": tg.initData } };
    if (body instanceof FormData) opts.body = body;
    else if (body) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
    return fetch(apiBase() + path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) throw new Error(j.error || "حصلت مشكلة - جرّب تاني"); return j;
      });
    });
  }

    card.addEventListener("mouseleave", leave);
    card.addEventListener("touchstart", function (e) { var t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
    card.addEventListener("touchmove", function (e) { var t = e.touches[0]; move(t.clientX, t.clientY); }, { passive: true });
    card.addEventListener("touchend", leave); card.addEventListener("touchcancel", leave);
  }
  function watchItems(done) {                           // الأفلام اللي بتراقبها في كل البلاد
    var codes = ((DATA && DATA.countries) || [{ code: country }]).map(function (c) { return c.code; });
    var pending = codes.filter(function (c) { return !CACHE[c]; });
    var finish = function () {
      var items = [];
      watchedIds().forEach(function (id) {
        codes.forEach(function (c) { var m = CACHE[c] && CACHE[c].movies[id]; if (m && !isConcert(m)) items.push({ m: m, c: c }); });
      });
      done(items);
    };
    if (!pending.length) return finish();
    var left = pending.length;
    pending.forEach(function (c) {
      fetch(dataBase + "/" + c + ".json?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; }).then(function (d) { if (d) CACHE[c] = d; })
        .catch(function () {}).then(function () { if (--left === 0) finish(); });
    });
  }
  function renderGrid() {
    var grid = $("grid"); grid.textContent = "";
    if (section === "w") {
      watchItems(function (items) {
        if (section !== "w") return;
        grid.textContent = "";
        if (!items.length) {
          grid.appendChild(el("div", "empty", "مفيش أفلام بتراقبها لسه.\nافتح «يعرض قريبًا» ودوس «راقب» على أي فيلم."));
          grid.style.display = "block"; return;
        }
        grid.style.display = "";
        items.forEach(function (it, n) { grid.appendChild(cardFor(it.m, n, it.c)); });
      });
      return;
    }
    var ids = listIds(section === "s" ? "whatson" : "comingsoon");
    if (!ids.length) { grid.appendChild(el("div", "empty", "مفيش أفلام هنا دلوقتي.")); grid.style.display = "block"; return; }
    grid.style.display = "";
    ids.forEach(function (id, n) {
      var m = DATA.movies[String(id)]; if (!m) return;
      grid.appendChild(cardFor(m, n, country));
    });
  }
  function cardFor(m, n, code) {
      var card = el("button", "card"); card.style.animationDelay = Math.min(n, 12) * 35 + "ms";
      var img = el("img"); img.loading = "lazy"; img.decoding = "async"; img.alt = ""; img.src = poster(m);
      img.onerror = function () { if (!img.dataset.f) { img.dataset.f = 1; img.src = "no_poster.jpg"; } };
      card.appendChild(img);
      if (m.rating) card.appendChild(el("span", "badge rating ltr", m.rating));
      if (m.bookable) card.appendChild(el("span", "badge book", "احجز"));
      var info = el("div", "info");
      info.appendChild(el("div", "title ltr", m.title));
      info.appendChild(subLine(m));
      card.appendChild(info);
      if (code !== country) { var w = el("span", "badge where"); w.appendChild(flag(code)); card.appendChild(w); }
      card.onclick = function () {
        haptic();
        if (code === country) return showDetail(m);
        store.set("country", code);                    // فيلم من بلد تانية: نروح بلده
        loadCountry(code, function () { renderHeader(); showDetail(m); });
      };
      tilt(card);
      return card;
  }

  // ---------- صفحة الفيلم ----------
  function trailerOf(m) {                               // تريلر ربطه الأدمن لسه ما وصلش البيانات؟ من الجهاز
    var local = null; try { local = localStorage.getItem("cft_trailer_" + country + "_" + m.id); } catch (e) {}
    return m.trailer || local || null;
  }
  function showDetail(m) {
    current = m;
    var hero = $("hero"), tr = trailerOf(m);
    var old = hero.querySelector("iframe"); if (old) old.remove();
    hero.style.backgroundImage = "url('" + (tr ? "https://i.ytimg.com/vi/" + tr + "/hqdefault.jpg" : poster(m)).replace(/'/g, "%27") + "')";
    $("play").style.display = tr ? "" : "none";
    var add = $("add-trailer");                         // الأدمن بس: فيلم مالوش تريلر
    add.style.display = (!tr && isAdmin()) ? "block" : "none";
    add.classList.remove("editing"); $("add-hint").textContent = ""; $("add-url").value = "";
    $("add-open").innerHTML = ICON.plus + " "; $("add-open").appendChild(document.createTextNode("إضافة تريلر"));

    $("d-title").textContent = m.title;
    var meta = $("d-meta"); meta.textContent = "";
    [m.genre, m.duration].filter(Boolean).forEach(function (p, i) { if (i) meta.appendChild(document.createTextNode(" • ")); meta.appendChild(el("bdi", "", p)); });
    var chips = $("d-chips"); chips.textContent = "";
    if (m.rating) chips.appendChild(el("span", "chip gold ltr", m.rating));
    if (m.release) chips.appendChild(el("span", "chip ltr", m.release));
    if (m.language) chips.appendChild(el("span", "chip ltr", m.language));

    var actions = $("d-actions"); actions.textContent = "";
    if (m.bookable) {
      var book = el("button", "btn primary"); book.innerHTML = ICON.ticket; book.appendChild(document.createTextNode(" احجز دلوقتي"));
      book.onclick = function () { haptic(); openTimes(m); }; actions.appendChild(book);
    }
    if (isWatched(m.id)) {
      var un = el("button", "btn outline unwatch"); un.innerHTML = ICON.eyeOff; un.appendChild(document.createTextNode(" إلغاء المراقبة"));
      un.onclick = function () { setWatched(m.id, false); sendToBot({ a: "unwatch", id: m.id }, "u_" + m.id); }; actions.appendChild(un);
    } else if (m.section === "c") {
      var watch = el("button", "btn outline"); watch.innerHTML = ICON.eye; watch.appendChild(document.createTextNode(" راقب"));
      watch.onclick = function () { setWatched(m.id, true); sendToBot({ a: "watch", id: m.id }, "w_" + m.id); }; actions.appendChild(watch);
    }
    if (!m.bookable && m.section === "s") actions.appendChild(el("div", "btn note", "الحجز لسه ما فتحش"));

    var desc = $("d-desc"); desc.textContent = m.description || ""; desc.classList.remove("open");
    $("d-more").style.display = (m.description || "").length > 140 ? "" : "none";
    loadFilm(m);                                       // تقييم CFTRadar والمراجعات (من سيرفر البوت)
    var details = $("d-details"); details.textContent = "";
    (m.details || []).forEach(function (p) {
      var row = el("div", "row"); row.appendChild(el("span", "k", p[0])); row.appendChild(el("span", "v ltr", p[1])); details.appendChild(row);
    });
    go("s-detail");
  }
  $("play").onclick = function () {                     // التريلر فوق اسم الفيلم - بيشتغل هنا جوه الصفحة
    var tr = current && trailerOf(current); if (!tr) return;
    haptic();
    var f = el("iframe");
    f.src = "https://www.youtube.com/embed/" + tr + "?autoplay=1&playsinline=1&rel=0&modestbranding=1&origin=" + encodeURIComponent(location.origin);
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen"; f.allowFullscreen = true;
    $("hero").appendChild(f); $("play").style.display = "none";
  };
  $("d-more").onclick = function () { var d = $("d-desc"); d.classList.toggle("open"); this.textContent = d.classList.contains("open") ? "عرض أقل" : "عرض المزيد"; };

  // ---------- الأدمن: ربط تريلر يوتيوب ----------
  function youtubeId(text) {
    var m = String(text || "").trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : (/^[A-Za-z0-9_-]{11}$/.test(String(text).trim()) ? String(text).trim() : null);
  }
  $("add-open").onclick = function () { haptic(); $("add-trailer").classList.add("editing"); $("add-url").focus(); };
  $("add-form").onsubmit = function (e) {
    e.preventDefault();
    var id = youtubeId($("add-url").value);
    if (!id) { $("add-hint").textContent = "ده مش لينك يوتيوب صحيح"; haptic("heavy"); return; }
    try { localStorage.setItem("cft_trailer_" + country + "_" + current.id, id); } catch (err) {}
    $("add-trailer").style.display = "none";            // المهمة خلصت: الزرار يختفي والتريلر يظهر
    $("hero").style.backgroundImage = "url('https://i.ytimg.com/vi/" + id + "/hqdefault.jpg')";
    $("play").style.display = "";
    sendToBot({ a: "trailer", id: current.id, v: id }, "t_" + current.id + "_" + id);
  };

  // ---------- المواعيد والحجز ----------
  var TIMES = null, timesDay = null, timesCinema = "";
  function openTimes(m) {
    $("t-title").textContent = m.title;
    $("t-days").textContent = ""; $("t-cinemas").textContent = "";
    var list = $("t-list"); list.textContent = "";
    if (!m.showtimes) { list.appendChild(el("div", "empty", "المواعيد لسه بتتجهز.\nجرب كمان شوية.")); go("s-times"); return; }
    for (var i = 0; i < 2; i++) { var sk = el("div", "skeleton cinema"); sk.style.aspectRatio = "auto"; sk.style.height = "130px"; list.appendChild(sk); }
    go("s-times");
    fetch(dataBase + "/" + country + "/st/" + m.id + ".json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) {
        TIMES = data; timesDay = (data.days[0] || {}).key;
        store.get("cinema_" + country, function (v) { timesCinema = v || ""; renderTimes(); });
      })
      .catch(function () { list.textContent = ""; list.appendChild(el("div", "error", "مش قادر أجيب المواعيد دلوقتي.\nجرب تاني كمان شوية.")); });
  }
  function renderTimes() {
    var days = $("t-days"); days.textContent = "";
    TIMES.days.forEach(function (d) {
      var b = el("button", "pill" + (d.key === timesDay ? " active" : ""), d.label);
      b.onclick = function () { haptic(); timesDay = d.key; renderTimes(); };
      days.appendChild(b);
    });
    var cinemas = TIMES.byDay[timesDay] || [];
    var names = cinemas.map(function (c) { return c.cinema; });
    if (timesCinema && names.indexOf(timesCinema) < 0) timesCinema = "";
    var bar = $("t-cinemas"); bar.textContent = "";
    if (names.length > 1) {                              // سينمتك: بتتفتكر للمرة الجاية
      [""].concat(names).forEach(function (n) {
        var b = el("button", "pill small" + (n === timesCinema ? " active" : ""), n || "كل السينمات");
        b.onclick = function () { haptic(); timesCinema = n; store.set("cinema_" + country, n); renderTimes(); };
        bar.appendChild(b);
      });
    }
    var list = $("t-list"); list.textContent = "";
    cinemas.filter(function (c) { return !timesCinema || c.cinema === timesCinema; }).forEach(function (c) {
      var box = el("div", "cinema"); box.appendChild(el("h3", "ltr", c.cinema));
      c.screens.forEach(function (sc) {
        if (sc.type) box.appendChild(el("div", "screen-type ltr", sc.type));
        var times = el("div", "times");
        sc.times.forEach(function (t) {
          var b = el("button", "time" + (t[1] ? "" : " full"), t[0]);
          if (t[1]) b.onclick = function () {
            haptic("medium");
            if (tg && tg.openLink) tg.openLink(t[1]); else window.open(t[1], "_blank");
          };
          else b.title = "كامل";
          times.appendChild(b);
        });
        box.appendChild(times);
      });
      list.appendChild(box);
    });
    if (!list.childNodes.length) list.appendChild(el("div", "empty", "مفيش عروض في اليوم ده."));
  }

  // ---------- تحميل البيانات ----------
  function loadCountry(code, done) {
    if (CACHE[code]) { DATA = CACHE[code]; country = code; done && done(); return; }
    fetch(dataBase + "/" + code + ".json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (data) { CACHE[code] = data; DATA = data; country = code; done && done(); })
      .catch(function () {
        if (!DATA) { show("s-list"); $("grid").textContent = ""; $("grid").style.display = "block";
          $("grid").appendChild(el("div", "error", "مش قادر أجيب الأفلام دلوقتي.\nاقفل الصفحة وافتحها تاني كمان شوية.")); }
      });
  }
  (function start() {
    var grid = $("grid");
    for (var i = 0; i < 6; i++) grid.appendChild(el("div", "skeleton"));
    show("s-list");
    // البيانات من https بس (أو من جهازك للتجربة)
    if (!/^(https:\/\/|http:\/\/(127\.0\.0\.1|localhost)[:\/])/.test(dataBase)) {
      grid.textContent = ""; grid.appendChild(el("div", "error", "افتح الصفحة من البوت.")); return;
    }
    store.get("country", function (saved) {
      // من تنبيه: بلد الفيلم (اللي في اللينك) هي اللي تمشي - غير كده آخر بلد كنت بتتفرج عليها
      if (!target && saved && /^[a-z]{2}$/.test(saved)) country = saved;
      loadCountry(country, function () {
        loadMe();                                       // التسجيل التلقائي (أول مرة) + صورة الحساب
        store.get("login", function (login) {
          renderHeader();
          if (!login) { renderLogin(); show("s-login"); return; }       // أول مرة: الدخول
          setTab(section); show("s-list"); openTarget();
        });
      });
    });
  })();
})();
</script>
</body>
